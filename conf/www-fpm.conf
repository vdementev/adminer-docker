[global]
error_log = /dev/stderr

[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 4096
rlimit_files = 131072

; Sized by docker-entrypoint.sh from the CPU the container actually got;
; override any of them with the matching environment variable.
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.process_idle_timeout = ${PHP_FPM_PROCESS_IDLE_TIMEOUT}
pm.max_requests = ${PHP_FPM_MAX_REQUESTS}

request_terminate_timeout = 14430s

catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php

; clear_env hides the container environment from the workers; the MongoDB
; driver plugin is the one thing that reads a variable out of it.
env[MONGO_AUTH_SOURCE] = $MONGO_AUTH_SOURCE

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
